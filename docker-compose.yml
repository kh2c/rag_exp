version: '3.8'

services:
  app:
    build: .
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    command: sh -c "uv sync && uv run python main.py"
    depends_on:
      - db
    networks:
      - rag-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rag-network

  adminer:
    image: adminer:latest
    ports:
      - "8888:8080"
    depends_on:
      - db
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres-data: